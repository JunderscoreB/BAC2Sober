<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="280" height="280">
  <!-- Pebble Menu Background (GColorBlack) -->
  <rect width="28" height="28" fill="#000000" />
  
  <!-- Top Liquid: Alcohol (GColorRed) - Gap at top, filled completely to constriction -->
  <polygon points="8,6 20,6 15,13 13,13" fill="#FF0000" />
  
  <!-- The Drip: Teardrop Shape (GColorVividCerulean) -->
  <path d="M 14,15 C 12.5,18 12.5,20 14,20 C 15.5,20 15.5,18 14,15 Z" fill="#00AAFF" />
  
  <!-- Bottom Liquid: Sober Water Filling Up (GColorVividCerulean) -->
  <polygon points="9,22 19,22 22,24 6,24" fill="#00AAFF" />
  
  <!-- Hourglass Glass Outline (GColorWhite) -->
  <polygon points="5,3 23,3 15,13 15,15 23,25 5,25 13,15 13,13" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Top and Bottom Caps (GColorWhite) -->
  <line x1="4" y1="3" x2="24" y2="3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="25" x2="24" y2="25" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>

